<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vYStnY7px5a42uILDEUWONsjziwYFxUkbY4V72LOx5M='; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Ballotta</title><link rel="canonical" href="https://ballotta.org/"></head>
<body>
<p>The new Ballotta is now at <a href="../">ballotta.org</a>.</p>
<script>(() => { const go = () => location.replace(new URL('../', location.href).href + location.hash);
  try { const sw = navigator.serviceWorker; if (!sw) return go();
    Promise.race([sw.getRegistration('./').then((g) => g && g.scope === new URL('./', location.href).href && g.update()),
                  new Promise((ok) => setTimeout(ok, 1500))]).catch(() => {}).then(go);
  } catch (e) { go(); } })();
</script>
</body></html>
