name: Pages

# #83: publish only the site's own files (`build_site.py --site`: the built pages and what they point at), not the
# whole repo, so tests/, docs/ and source/ are never served. On every push to main, and by hand.
# The pipeline tests run first, in their own job with read-only permissions (round-2 audit #3): a hand edit to the
# answer key or the vote centers that the build faithfully copies would otherwise deploy before Build check, running
# in parallel, turned red; and the packages they install from PyPI never run where the deploy credentials are. The
# deploy job itself refuses a change to the published site without a new VERSION, or a VERSION lower than a release
# already tagged (source/check_bumped.py, #117): stdlib and git only, so it runs even when the pipeline job is skipped.
# `--site` then refuses when the committed build has drifted from its sources (the same check as Build check).
# If PyPI itself is down during a rollback, run this workflow by hand with "skip the pipeline tests" (docs/RUNBOOK.md).
# If Settings → Pages → Source is ever set back to a branch, Pages publishes the branch itself: this workflow then
# builds the folder and says so, but deploys nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_pipeline_tests:
        description: "Skip the pipeline tests (only if PyPI is down during a rollback; --site's build check still runs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ !inputs.skip_pipeline_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The PDF libraries the pipeline tests use (pinned in requirements.txt)
        run: grep -E '^(pdfplumber|pdfminer\.six)==' requirements.txt | python3 -m pip install --break-system-packages -r /dev/stdin
      - name: The answer key against the ballot PDF, and the release check, before anything deploys
        run: python3 tests/test_pipeline.py
      - name: The results back end (rules, parsers, build) before anything deploys
        run: python3 tests/test_results.py

  # The results demo at /demo/ (Lane, Oct 20): the page as the results branch has it, with made-up names and results,
  # encrypted with the DEMO_PASSWORD secret (source/build_demo.py, source/demo_lock.mjs). Its own job, read-only and
  # without the deploy's credentials, since it runs the results branch's code; only the locked page leaves it, and
  # nothing is committed. No secret, no demo. It can never hold up the live site: without it, the site deploys as before.
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # every branch: the demo is built from the results branch
      - name: Build the demo and lock it (none without the DEMO_PASSWORD secret)
        id: lock
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$DEMO_PASSWORD" ]; then echo "::notice::No DEMO_PASSWORD secret, so no demo at /demo/"; exit 0; fi
          branch=results-build
          git rev-parse -q --verify "origin/$branch" >/dev/null || branch=main   # once results ship, main has it all
          git worktree add -q --detach ../demo-src "origin/$branch"
          python3 ../demo-src/source/build_demo.py ../demo.html
          node ../demo-src/source/demo_lock.mjs ../demo.html locked/demo/index.html
          rm ../demo.html
          echo "built=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::Demo built from $branch ($(git -C ../demo-src rev-parse --short HEAD)), locked for /demo/"
      - if: steps.lock.outputs.built == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: demo-locked
          path: locked
          retention-days: 1

  deploy:
    needs: [pipeline, demo]
    if: ${{ !cancelled() && (needs.pipeline.result == 'success' || (needs.pipeline.result == 'skipped' && inputs.skip_pipeline_tests)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # history and tags, for the bump check
      - name: A change to the published site comes with a new VERSION (round-2 audit #19); never skipped
        run: python3 source/check_bumped.py
      - name: The published results.json is sound (stdlib only, so never skipped either)
        run: python3 source/check_results.py
      - name: Build the site folder
        run: python3 source/build_site.py --site _site
      - name: The locked demo, if the demo job made one (its absence never stops the deploy)
        if: ${{ needs.demo.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: demo-locked
          path: ${{ runner.temp }}/demo
      - name: Only the demo's one page goes into the site (the branch's scripts made it; nothing else of theirs is published, #159)
        if: ${{ needs.demo.result == 'success' }}
        env:
          D: ${{ runner.temp }}/demo
        run: if [ -f "$D/demo/index.html" ]; then mkdir -p _site/demo && cp "$D/demo/index.html" _site/demo/index.html; fi
      - name: Where Pages publishes from
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - if: steps.source.outputs.type == 'workflow'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - if: steps.source.outputs.type != 'workflow'
        run: echo "::notice::Pages publishes from the branch (build_type '${{ steps.source.outputs.type }}'), so nothing was deployed. Switch Settings → Pages → Source to GitHub Actions."
