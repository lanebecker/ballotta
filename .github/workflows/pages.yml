name: Pages

# #83: publish only the site's own files (`build_site.py --site`: the built pages and what they point at), not the
# whole repo, so tests/, docs/ and source/ are never served. On every push to main, and by hand.
# The pipeline tests run first, in their own job with read-only permissions (round-2 audit #3): a hand edit to the
# answer key or the vote centers that the build faithfully copies would otherwise deploy before Build check, running
# in parallel, turned red; and the packages they install from PyPI never run where the deploy credentials are. The
# deploy job itself refuses a change to the published site without a new VERSION, or a VERSION lower than a release
# already tagged (source/check_bumped.py, #117): stdlib and git only, so it runs even when the pipeline job is skipped.
# `--site` then refuses when the committed build has drifted from its sources (the same check as Build check).
# If PyPI itself is down during a rollback, run this workflow by hand with "skip the pipeline tests" (docs/RUNBOOK.md).
# If Settings → Pages → Source is ever set back to a branch, Pages publishes the branch itself: this workflow then
# builds the folder and says so, but deploys nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_pipeline_tests:
        description: "Skip the pipeline tests (only if PyPI is down during a rollback; --site's build check still runs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ !inputs.skip_pipeline_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The PDF libraries the pipeline tests use (pinned in requirements.txt)
        run: grep -E '^(pdfplumber|pdfminer\.six)==' requirements.txt | python3 -m pip install --break-system-packages -r /dev/stdin
      - name: The answer key against the ballot PDF, and the release check, before anything deploys
        run: python3 tests/test_pipeline.py

  deploy:
    needs: pipeline
    if: ${{ !cancelled() && (needs.pipeline.result == 'success' || (needs.pipeline.result == 'skipped' && inputs.skip_pipeline_tests)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # history and tags, for the bump check
      - name: A change to the published site comes with a new VERSION (round-2 audit #19); never skipped
        run: python3 source/check_bumped.py
      - name: Build the site folder
        run: python3 source/build_site.py --site _site
      - name: Where Pages publishes from
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - if: steps.source.outputs.type == 'workflow'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - if: steps.source.outputs.type != 'workflow'
        run: echo "::notice::Pages publishes from the branch (build_type '${{ steps.source.outputs.type }}'), so nothing was deployed. Switch Settings → Pages → Source to GitHub Actions."
